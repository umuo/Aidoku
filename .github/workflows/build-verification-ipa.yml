name: Build verification IPA

on:
    workflow_dispatch:
    push:
        branches:
            - codex/website-verification-ipa

permissions:
    contents: read

jobs:
    build:
        runs-on: macos-26
        timeout-minutes: 60
        steps:
            -
                uses: actions/checkout@v4
            -
                name: Check build environment
                run: |
                    xcodebuild -version
                    xcrun swift --version
                    xcrun --sdk iphoneos --show-sdk-version
            -
                name: Test verification modules
                run: python3 tools/test-website-verification.py
            -
                name: Archive device application
                run: |
                    set -o pipefail
                    xcodebuild -project Aidoku.xcodeproj -scheme Aidoku -configuration Release \
                        -destination 'generic/platform=iOS' archive -archivePath build/Aidoku.xcarchive \
                        -disableAutomaticPackageResolution -skipPackagePluginValidation \
                        CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
                        | tee build-archive.log
            -
                name: Package unsigned IPA
                run: |
                    mkdir -p build/ipa/Payload
                    ditto build/Aidoku.xcarchive/Products/Applications/Aidoku.app build/ipa/Payload/Aidoku.app
                    cd build/ipa
                    zip -qry ../Aidoku-website-verification-unsigned.ipa Payload
                    unzip -t ../Aidoku-website-verification-unsigned.ipa
                    shasum -a 256 ../Aidoku-website-verification-unsigned.ipa > ../Aidoku-website-verification-unsigned.ipa.sha256
            -
                name: Upload IPA
                uses: actions/upload-artifact@v4
                with:
                    name: Aidoku-website-verification-unsigned
                    path: |
                        build/Aidoku-website-verification-unsigned.ipa
                        build/Aidoku-website-verification-unsigned.ipa.sha256
                    if-no-files-found: error
                    retention-days: 7
            -
                name: Upload build diagnostics
                if: failure()
                uses: actions/upload-artifact@v4
                with:
                    name: build-diagnostics
                    path: build-archive.log
                    if-no-files-found: ignore
                    retention-days: 7
